<style>
/* Layout: una sola pantalla de arcade, el lienzo 9:16 centrado y escalado al alto disponible */
:root{
  --night:#141a33;      /* fondo de la página */
  --ink:#f6f1e7;        /* texto */
  --muted:#9aa3c7;      /* texto secundario */
  --carrot:#ff8a2a;     /* acento */
  --cactus:#3f9d4b;
  --f-display:"Pixelify Sans","Silkscreen",ui-monospace,monospace;
  --f-small:"Silkscreen","Pixelify Sans",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--night);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;box-sizing:border-box;overflow:hidden;
  font-family:var(--f-small);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
#stage{position:relative;flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:6px;box-shadow:0 0 0 3px #0b0f20,0 0 0 6px #2b3566,0 18px 40px rgba(0,0,0,.45);touch-action:none;cursor:pointer;outline:none}
canvas:focus-visible{box-shadow:0 0 0 3px #0b0f20,0 0 0 6px var(--carrot)}
.hint{font-size:11px;letter-spacing:.06em;color:var(--muted);text-align:center;line-height:1.5}
.hint b{color:var(--carrot);font-weight:400}
@media (max-width:480px){.hint{display:none}}
</style>

let scale=1,dpr=1;
function resize(){
  const st=document.getElementById('stage');
  const aw=st.clientWidth, ah=st.clientHeight;
  let h=ah, w=h*W/H; if(w>aw){w=aw;h=w*H/W}
  w=Math.floor(w);h=Math.floor(h);
  dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.style.width=w+'px';cv.style.height=h+'px';
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  scale=cv.width/W;
}

// ---------- audio ----------
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f0,f1,dur,type='square',vol=.08,delay=0){
  if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+delay;
  const o=a.createOscillator(),g=a.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02);
}
function noise(dur,vol=.2){
  if(muted)return;const a=ac();if(!a)return;const n=a.sampleRate*dur,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=1200;
  s.buffer=b;g.gain.value=vol;s.connect(f).connect(g).connect(a.destination);s.start();
}
const SFX={
  flap(){tone(320,620,.09,'square',.05)},
  point(){tone(880,880,.07,'square',.05);tone(1320,1320,.1,'square',.05,.07)},
  carrot(){[660,880,1100,1320].forEach((f,i)=>tone(f,f,.07,'triangle',.07,i*.05))},
  hit(){noise(.25,.35);tone(200,60,.25,'sawtooth',.08)},
  die(){tone(500,90,.6,'triangle',.09,.05)},
  best(){[523,659,784,1046].forEach((f,i)=>tone(f,f,.12,'square',.05,i*.1))},
  click(){tone(600,600,.04,'square',.04)}
};

// ---------- utilidades de dibujo ----------
function spr(name,i,x,y,s,anchor,rot,alpha){
  const fr=META[name];if(!fr)return;const f=fr[((i%fr.length)+fr.length)%fr.length];
  const w=f[2]*s,h=f[3]*s;ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);if(alpha!=null)ctx.globalAlpha=alpha;
  ctx.drawImage(atlas,f[0],f[1],f[2],f[3],-w/2,anchor==='b'?-h:-h/2,w,h);ctx.restore();
}
function txt(s,x,y,size,fill='#fff',align='center',font='display',stroke=true){
  ctx.font=`700 ${size}px ${font==='display'?'"Pixelify Sans"':'"Silkscreen"'}, ui-monospace, monospace`;
  ctx.textAlign=align;ctx.textBaseline='middle';
  if(stroke){ctx.lineJoin='round';ctx.lineWidth=Math.max(3,size/5);ctx.strokeStyle='#1a1230';ctx.strokeText(s,x,y)}
  ctx.fillStyle=fill;ctx.fillText(s,x,y);
}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function lerp(a,b,t){return a+(b-a)*t}
function hex(c){const n=parseInt(c.slice(1),16);return[n>>16,(n>>8)&255,n&255]}
function mix(c1,c2,t){const a=hex(c1),b=hex(c2);return`rgb(${a.map((v,i)=>Math.round(lerp(v,b[i],t))).join(',')})`}
function rnd(a,b){return a+Math.random()*(b-a)}

function nightW(){const p=((phase%3)+3)%3;return p<1?0:p<2?(p-1):(3-p)}

function makeRidge(len,base,amp,step,seed){const a=[];let s=seed;const r=()=>{s=(s*9301+49297)%233280;return s/233280};
  let h=base;for(let i=0;i<len;i+=step){h+=(r()-.5)*amp;h=Math.max(base-amp*1.5,Math.min(base+amp*.6,h));a.push(Math.round(h/4)*4)}a[a.length-1]=a[0];return a}
const RIDGE_FAR=makeRidge(720,GROUND-150,46,12,7), RIDGE_NEAR=makeRidge(720,GROUND-75,40,8,31);
const STARS=Array.from({length:60},()=>({x:rnd(0,W),y:rnd(0,GROUND-200),s:Math.random()<.2?2:1,tw:rnd(0,6)}));
const CACTI=Array.from({length:6},(_,i)=>({x:i*130+rnd(0,60),h:rnd(18,34)}));
let clouds=Array.from({length:5},()=>({x:rnd(0,W),y:rnd(40,260),w:rnd(40,90),v:rnd(6,14)}));
let off={far:0,near:0,ground:0,cactus:0};

function drawRidge(arr,offset,step,color){
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,GROUND);
  const len=arr.length*step;
  for(let x=-step;x<=W+step;x+=step){const wx=((x+offset)%len+len)%len;const i=Math.floor(wx/step);ctx.lineTo(x-(wx%step),arr[i]);ctx.lineTo(x-(wx%step)+step,arr[i])}
  ctx.lineTo(W,GROUND);ctx.closePath();ctx.fill();
}
function drawProceduralBg(t){
  const g=ctx.createLinearGradient(0,0,0,GROUND);g.addColorStop(0,pal('top'));g.addColorStop(1,pal('bot'));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,GROUND);
  const nw=nightW();
  if(nw>0){ctx.fillStyle='#fff';STARS.forEach(s=>{ctx.globalAlpha=nw*(.5+.5*Math.sin(t*2+s.tw));ctx.fillRect(Math.round(s.x),Math.round(s.y),s.s,s.s)});ctx.globalAlpha=1;
    // luna
    ctx.globalAlpha=nw;rect(278,70,28,28,'#f4f0d8');rect(274,74,36,20,'#f4f0d8');rect(286,78,6,6,'#d9d3b0');rect(296,88,4,4,'#d9d3b0');ctx.globalAlpha=1}
  else{ // sol
    const sy=lerp(90,GROUND-120,Math.min(1,((phase%3)+3)%3));ctx.globalAlpha=1-nw;rect(272,sy,32,32,'#fff4b8');rect(268,sy+4,40,24,'#fff4b8');ctx.globalAlpha=1}
  // nubes
  clouds.forEach(c=>{ctx.globalAlpha=.85-nw*.4;const col=pal('cloud');const x=Math.round(c.x),y=Math.round(c.y);
    rect(x,y,c.w,12,col);rect(x+8,y-8,c.w*.45,10,col);rect(x+c.w*.45,y-12,c.w*.35,14,col);ctx.globalAlpha=1});
  drawRidge(RIDGE_FAR,off.far,12,pal('far'));
  drawRidge(RIDGE_NEAR,off.near,8,pal('near'));
  // cactus de fondo (silueta)
  ctx.fillStyle=mix('#2f6b3a','#141a33',nightW()*.8);
  CACTI.forEach(c=>{let x=((c.x-off.cactus)%780+780)%780-60;const h=c.h;
    ctx.fillRect(x,GROUND-h,6,h);ctx.fillRect(x-6,GROUND-h*.7,4,h*.35);ctx.fillRect(x-6,GROUND-h*.4,6,3);ctx.fillRect(x+8,GROUND-h*.8,4,h*.35);ctx.fillRect(x+6,GROUND-h*.5,6,3)});
}
function drawBg(t){
  if(!background.complete||!background.naturalWidth){drawProceduralBg(t);return}
  const s=Math.max(W/background.naturalWidth,GROUND/background.naturalHeight);
  const w=background.naturalWidth*s,h=background.naturalHeight*s;
  ctx.drawImage(background,(W-w)*.69,(GROUND-h)/2,w,h);
}
function drawGround(){
  rect(0,GROUND,W,H-GROUND,pal('sand'));
  rect(0,GROUND,W,6,pal('edge'));
  ctx.fillStyle=pal('sand2');
  const o=off.ground%24;
  for(let x=-24;x<W+24;x+=24){ctx.beginPath();ctx.moveTo(x-o,GROUND+10);ctx.lineTo(x-o+12,GROUND+10);ctx.lineTo(x-o+4,GROUND+22);ctx.lineTo(x-o-8,GROUND+22);ctx.fill()}
  rect(0,GROUND+22,W,2,pal('edge'));
  for(let i=0;i<9;i++){const xx=((i*53-off.ground)%(W+40)+W+40)%(W+40)-20;rect(xx,GROUND+38+(i%3)*18,6,3,pal('sand2'));rect(xx+10,GROUND+44+(i%3)*18,3,3,pal('edge'))}
}

// ---------- obstáculos: nopales / cactus ----------
const PW=58;
function drawCactus(x,y0,y1,capAtBottom){
  const h=y1-y0;if(h<=0)return;
  const body='#3f9d4b',dark='#2c7438',light='#7fd06f',spine='#f3edc8',outline='#1c3d22';
  rect(x-2,y0,PW+4,h,outline);rect(x,y0,PW,h,body);
  for(let i=8;i<PW-4;i+=12)rect(x+i,y0,3,h,dark);
  rect(x+3,y0,4,h,light);
  ctx.fillStyle=spine;
  for(let yy=y0+6;yy<y1-4;yy+=14){for(let i=2;i<PW;i+=12){ctx.fillRect(x+i,yy+((i/12)%2?6:0),2,2)}}
  const capH=22,cy=capAtBottom?y1-capH:y0;
  rect(x-6,cy-2,PW+12,capH+4,outline);rect(x-4,cy,PW+8,capH,body);rect(x-4,cy+(capAtBottom?capH-5:0),PW+8,5,dark);rect(x-1,cy+3,4,capH-6,light);
  for(let i=6;i<PW;i+=12)rect(x+i,cy+8,2,2,spine);
  // flor del nopal en la orilla del hueco
  const fy=capAtBottom?y1+1:y0-1, dir=capAtBottom?1:-1, fx=x+PW-14;
  rect(fx-5,fy+dir*2-(dir<0?6:0),10,6,'#ff5f9e');rect(fx-2,fy+dir*6-(dir<0?4:0),4,4,'#ffd34d');
}
function drawCarrot(x,y,t){
  const b=Math.sin(t*4)*3;ctx.save();ctx.translate(Math.round(x),Math.round(y+b));ctx.rotate(.5);
  ctx.fillStyle='#1a1230';ctx.beginPath();ctx.moveTo(-8,-12);ctx.lineTo(8,-12);ctx.lineTo(1,14);ctx.lineTo(-1,14);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ff8a2a';ctx.beginPath();ctx.moveTo(-6,-10);ctx.lineTo(6,-10);ctx.lineTo(0,11);ctx.closePath();ctx.fill();
  ctx.fillStyle='#d9661a';ctx.fillRect(-3,-4,4,2);ctx.fillRect(0,2,3,2);
  ctx.fillStyle='#4cc35a';ctx.fillRect(-5,-18,3,8);ctx.fillRect(-1,-20,3,10);ctx.fillRect(3,-17,3,7);
  ctx.restore();
}

// ---------- estado del juego ----------
const P={x:110,y:300,vy:0,rot:0,flapT:0,animT:0,deadT:0,state:''};
let state='title', t=0, score=0, carrots=0, pipes=[], parts=[], pops=[], shake=0, flash=0, nextPipeX=0, lastGap=300, overT=0, newBest=false, paused=false, buttons=[];

function speed(){return 150+Math.min(score,40)*1.6}
function gapSize(){return Math.max(128,172-score*1.3)}

function reset(){
  score=0;carrots=0;pipes=[];parts=[];pops=[];P.x=110;P.y=290;P.vy=0;P.rot=0;P.deadT=0;P.animT=0;
  phase=0;phaseTarget=0;newBest=false;lastGap=300;
}
function spawnPipe(x){
  const g=gapSize();let c=rnd(110+g/2,GROUND-60-g/2);
  c=Math.max(lastGap-190,Math.min(lastGap+190,c));lastGap=c;
  pipes.push({x,gapY:c,gap:g,passed:false,carrot:Math.random()<.45?{x:x+PW+rnd(50,90),y:c+rnd(-g*.25,g*.25),got:false}:null});
}
function flap(){
  P.vy=-430;P.flapT=.14;SFX.flap();
  for(let i=0;i<4;i++)parts.push({x:P.x-14,y:P.y+12,vx:rnd(-60,-20),vy:rnd(-10,40),life:.35,max:.35,c:'#ffffff',s:3});
}
function startReady(){reset();state='ready';SFX.click()}
function startPlay(){state='play';nextPipeX=W+40;spawnPipe(W+40);flap()}
function die(){
  if(state!=='play')return;state='hit';P.deadT=0;SFX.hit();shake=reduceMotion?0:10;flash=1;
  for(let i=0;i<10;i++)parts.push({x:P.x,y:P.y,vx:rnd(-160,160),vy:rnd(-200,40),life:.6,max:.6,c:Math.random()<.5?'#ffd34d':'#ffffff',s:4});
}
function finish(){
  state='over';overT=0;SFX.die();
  totalCarrots+=carrots;store.set('uriel-carrots',totalCarrots);
  if(score>best){best=score;newBest=true;store.set('uriel-best',best);setTimeout(()=>SFX.best(),500)}
}
function medal(s){if(s>=50)return{n:'LEYENDA',c:'#7ff0ff',d:'#2a8fa8'};if(s>=35)return{n:'ORO',c:'#ffd34d',d:'#b8860b'};if(s>=20)return{n:'PLATA',c:'#e6ecf5',d:'#8a96ad'};if(s>=10)return{n:'BRONCE',c:'#e3955a',d:'#8a4b22'};return null}

// ---------- actualización ----------
function update(dt){
  t+=dt;
  if(paused)return;
  const moving=state==='title'||state==='ready'||state==='play';
  const sp=state==='play'?speed():state==='title'||state==='ready'?110:0;
  if(moving){off.ground+=sp*dt;off.near+=sp*.35*dt;off.far+=sp*.15*dt;off.cactus+=sp*.5*dt}
  clouds.forEach(c=>{c.x-=c.v*dt*(moving?1.6:.3);if(c.x<-c.w-20){c.x=W+rnd(10,80);c.y=rnd(40,260);c.w=rnd(40,90)}});
  phase=lerp(phase,phaseTarget,Math.min(1,dt*.8));
  P.animT+=dt;

  if(state==='ready'){P.y=290+Math.sin(t*4)*8;P.rot=0}
  if(state==='play'){
    P.vy=Math.min(P.vy+1500*dt,720);P.y+=P.vy*dt;P.flapT-=dt;
    if(P.y<18){P.y=18;P.vy=Math.max(P.vy,0)}
    P.rot=lerp(P.rot,Math.max(-.35,Math.min(.5,P.vy/900)),Math.min(1,dt*10));
    for(const p of pipes){p.x-=sp*dt;if(p.carrot)p.carrot.x-=sp*dt}
    if(pipes.length&&pipes[pipes.length-1].x<W-205)spawnPipe(W+20);
    pipes=pipes.filter(p=>p.x>-PW-120);
    for(const p of pipes){
      if(!p.passed&&p.x+PW<P.x-10){p.passed=true;score++;SFX.point();pops.push({x:W/2,y:110,txt:'+1',life:.6});
        if(score%12===0)phaseTarget=Math.floor(score/12);}
      if(p.carrot&&!p.carrot.got&&Math.hypot(p.carrot.x-P.x,p.carrot.y-P.y)<24){p.carrot.got=true;carrots++;SFX.carrot();
        for(let i=0;i<12;i++)parts.push({x:p.carrot.x,y:p.carrot.y,vx:rnd(-120,120),vy:rnd(-140,60),life:.5,max:.5,c:i%2?'#ff8a2a':'#ffd34d',s:3});
        pops.push({x:p.carrot.x,y:p.carrot.y-20,txt:'🥕',life:.7,carrot:true})}
      // colisión círculo vs rectángulos
      const cx=P.x,cy=P.y+4,r=15;
      const rects=[[p.x-4,0,PW+8,p.gapY-p.gap/2],[p.x-4,p.gapY+p.gap/2,PW+8,GROUND]];
      for(const [rx,ry,rw,rh] of rects){const nx=Math.max(rx,Math.min(cx,rx+rw)),ny=Math.max(ry,Math.min(cy,ry+rh));if((nx-cx)**2+(ny-cy)**2<r*r){die();break}}
    }
    if(P.y+18>=GROUND){P.y=GROUND-18;die()}
  }
  if(state==='hit'){P.deadT+=dt;if(P.deadT>.38){state='falling';P.vy=-180;P.deadT=0}}
  if(state==='falling'){P.vy=Math.min(P.vy+1600*dt,800);P.y+=P.vy*dt;P.rot+=dt*5;if(P.y>=GROUND-10){P.y=GROUND;state='dead';P.deadT=0;noise(.12,.25);shake=reduceMotion?0:6}}
  if(state==='dead'){P.deadT+=dt;if(P.deadT>1.0)finish()}
  if(state==='over')overT+=dt;
  if(shake>0)shake=Math.max(0,shake-dt*40);if(flash>0)flash=Math.max(0,flash-dt*4);
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.life-=dt});parts=parts.filter(p=>p.life>0);
  pops.forEach(p=>{p.y-=40*dt;p.life-=dt});pops=pops.filter(p=>p.life>0);
}

// ---------- render ----------
function drawPlayer(){
  const S=.74;
  if(state==='title'){spr('run',Math.floor(t*12),W/2,GROUND+2,.9,'b');return}
  if(state==='ready'){spr('fly',Math.floor(t*10),P.x,P.y,S,'c');return}
  if(state==='play'){
    if(P.flapT>0){spr('jump',P.flapT>.07?1:2,P.x,P.y,S*.92,'c',P.rot*.5)}
    else if(P.vy<260){spr('fly',Math.floor(t*14),P.x,P.y,S,'c',P.rot)}
    else{const i=Math.min(4,Math.floor((P.vy-260)/100));spr('fall',i,P.x,P.y,S*.9,'c',P.rot*.3)}
    return}
  if(state==='hit'){spr('hit',Math.min(3,Math.floor(P.deadT/.1)),P.x,P.y,S,'c');return}
  if(state==='falling'){spr('hit',3,P.x,P.y,S,'c',Math.min(P.rot,1.2));return}
  if(state==='dead'||state==='over'){const i=Math.min(4,Math.floor((state==='over'?9:P.deadT)/.13));spr('die',i,P.x,GROUND+4,S,'b');return}
}

function iconBtn(id,x,y,draw){rect(x,y,34,34,'rgba(26,18,48,.55)');rect(x+2,y+2,30,30,'rgba(255,255,255,.12)');draw(x,y);buttons.push({id,x,y,w:34,h:34})}
function panel(x,y,w,h){rect(x-3,y-3,w+6,h+6,'#1a1230');rect(x,y,w,h,'#f3e6c4');rect(x,y,w,4,'#fff7e0');rect(x,y+h-6,w,6,'#d8c391');rect(x+6,y+6,w-12,h-12,'#efdcb0');}

function render(){
  buttons=[];
  ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.fillStyle='#141a33';ctx.fillRect(0,0,cv.width,cv.height);

  for(const p of pipes){drawCactus(p.x,-10,p.gapY-p.gap/2,true);drawCactus(p.x,p.gapY+p.gap/2,GROUND,false);if(p.carrot&&!p.carrot.got)drawCarrot(p.carrot.x,p.carrot.y,t)}

    ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.globalAlpha=b?0:.8;ctx.beginPath();ctx.arc(W/2+27,356,12,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;

// ---------- bucle ----------
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(loop)}

// ---------- entrada ----------
let pressId=null;
function hitBtn(x,y){return buttons.find(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)}
function toLogical(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
function doButton(id){
  if(id==='mute'){muted=!muted;store.set('uriel-muted',muted);if(!muted)SFX.click();return}
  if(id==='pause'){paused=true;return}
  if(id==='resume'){paused=false;last=performance.now();return}
  if(id==='menu'){paused=false;reset();state='title';SFX.click();return}
  if(id==='play'||id==='again'){startReady();return}
}
function action(){
  ac();
  if(paused)return;
  if(state==='title')startReady();
  else if(state==='ready')startPlay();
  else if(state==='play')flap();
  else if(state==='over'&&overT>.6)startReady();
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();cv.focus();ac();
  const [x,y]=toLogical(e);const b=hitBtn(x,y);
  if(b){pressId=b.id;setTimeout(()=>{pressId=null},120);doButton(b.id);return}
  if(state==='over')return; // en fin de partida solo con botones o espacio
  action();
});
addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Enter'){e.preventDefault();if(paused){paused=false;last=performance.now();return}action()}
  else if(e.code==='KeyP'||e.code==='Escape'){if(state==='play')paused=!paused;last=performance.now()}
  else if(e.code==='KeyM'){doButton('mute')}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')paused=true});

function boot(){resize();requestAnimationFrame(t0=>{last=t0;requestAnimationFrame(loop)})}
const fontsReady=(document.fonts?Promise.race([Promise.all([document.fonts.load('700 20px "Pixelify Sans"'),document.fonts.load('12px "Silkscreen"')]),new Promise(r=>setTimeout(r,1500))]):Promise.resolve());
Promise.all([fontsReady,new Promise(r=>{if(atlas.complete)r();else{atlas.onload=r;atlas.onerror=r}})]).then(boot);
})();
</script>

</body></html>
